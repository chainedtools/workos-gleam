name = "workos_gleam"
version = "0.1.0"
target = "erlang"
description = "WorkOS SDK for Gleam: typed API client and SSO redirect helpers."
licences = ["MIT"]

[dependencies]
gleam_stdlib = ">= 0.60.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_json = ">= 2.0.0 and < 4.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
